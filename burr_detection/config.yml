# YOLO Burr Detection Configuration

training_steps:
  - batch: 16
    accumulate: 1
    max_epochs: 50
    patience: 10
  - batch: 64
    accumulate: 1
    max_epochs: 50
    patience: 15
  - batch: 256
    accumulate: 1 
    max_epochs: 50
    patience: 20
  - batch: 256
    accumulate: 4
    max_epochs: 50
    patience: 25
  
training_params: # or starting point for tuning 
  - model_size: yolov8s.pt
    optimizer: SGD
    lr0: 0.007535468502919781
    lrf: 0.006106862115975325
    momentum: 0.860563804337033
    weight_decay: 0.007999986538396332
    box_gain: 7.5
    cls_gain: 0.7502019533851836
    dfl_gain: 1.6487943474402535
    hsv_h: 0.0024535962939831795
    hsv_s: 0.21180924495072723
    hsv_v: 0.1921254122518909
    degrees: 0.9028471314034809
    scale: 0.5
    flipud: 0.5

# Composite objective for tuning + best-model selection.
# Optimizes a gain-invariant blend instead of raw val_loss (which is confounded
# by also tuning the box/cls/dfl loss gains).
score_weights:
  loss: 0.45
  f1: 0.35
  map50: 0.20

# Progressive-step LR scaling:
#   scaled_lr = min( min(lr0, max_lr0) * (eff_batch / ref)^power , max_scaled_lr )
# Defaults below suit the current SGD config (lr0 ~ 0.0075, search max 0.01).
# For AdamW use lower caps (e.g. max_lr0=0.003, max_scaled_lr=0.005).
lr_reference_effective_batch: 64
lr_scale_power: 0.5
max_lr0: 0.01
max_scaled_lr: 0.03

# Tuning-results analysis plots written at the end of a tuning run.
analysis:
  enabled: true
  top_n: 10

tuning_space:
  model_size: ["yolo11s.pt", "yolo11m.pt", "yolov8s.pt", "yolov8m.pt"]
  optimizer: ["AdamW", "SGD", "Adam"]
  lr0: {"loguniform": [0.0005, 0.01]}
  lrf: {"loguniform": [0.001, 0.1]} # fraction of initial lr (decays towards lrf*lr0)
  momentum: {"uniform": [0.85, 0.98]}
  weight_decay: {"loguniform": [0.0001, 0.01]}
  box_gain: {"uniform": [4.0, 12.0]}     # spans the 7.5 default -- lets the search balance box vs cls/dfl
  cls_gain: {"uniform": [0.5, 2.0]}
  dfl_gain: {"uniform": [1.5, 3.0]}
  hsv_h: {"uniform": [0.001, 0.005]}
  hsv_s: {"uniform": [0.1, 0.3]}
  hsv_v: {"uniform": [0.1, 0.25]}
  degrees: {"uniform": [0.0, 180.0]}   # nadir imagery: rotation is free + fully valid
  scale: {"uniform": [0.2, 0.5]}        # moderate -- high scale shrinks small burrs out of existence
  flipud: {"uniform": [0.0, 0.5]}       # vertical flip prob -- nadir imagery has no canonical "up"

ray_tune:
  num_samples: 150
  max_concurrent_trials: 2
  # Seed trial 0 with training_params (warm start). Turn on once you have a config that
  # fits the current search space; leave off to explore from scratch.
  warm_start: false

inference:
  model_path: null # specify path to model .pt, or use most-recent from training/tuning
  conf_threshold: 0.5
  iou_threshold: 0.45       # per-tile NMS during predict()
  global_nms_iou: 0.3       # light cross-tile NMS after core-region filtering
  tile_batch_size: 96       # tiles per batched predict() call

data:
  # Bundled sample (download burr_detection/sample_data from Google Drive): the cleaned
  # Orchard 4 tile set in training/tiled/ (ready to split + train), plus the source canopy
  # images + polygon labels in training/full_canopy/ for reference/re-tiling. Point at your
  # own dataset with `--data-root <dir>` to tile full_canopy/ via the tiler.
  training_dir: burr_detection/sample_data/training/tiled
  outputs_dir: burr_detection/sample_data/training/outputs
  image_selections: image_selection/sample_data/outputs/best_image_selections.json
  # Tiling source for --mode preprocess; null = split the pre-made tiles in training_dir.
  # --data-root sets these to <root>/full_canopy/{images,labels,canopy}.
  full_res_images_dir: null
  polygon_labels_dir: null
  canopy_labels_dir: null
  # Model for false-negative label augmentation (null = skip; set via --data-root or here).
  audit_model: null
  augment_conf: 0.4
  tiling:
    tile_size: 224          # match inference CanopyTiler
    overlap: 0.2
    min_canopy_frac: 0.15   # drop mostly-masked-out (background) tiles
    bg_keep_ratio: 0.3      # fraction of burr-free canopy tiles kept as negatives
    dedup_iou: 0.8          # drop burr boxes overlapping this much (double-annotations)

# Train/val/test split. The group key function is supplied in code
# (burr_tile_group_key); these control the fractions and seed.
split:
  fracs: [0.7, 0.2, 0.1]
  seed: 666